<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20260708-3">

  <style>
    /* ───────── Tasks page · board layout (scoped, styles.css untouched) ───────── */
    body[data-active-page="task"] { --tk-amber: #f59e0b; --tk-blue: #3b82f6; --tk-green: #10b981; }

    /* Header */
    body[data-active-page="task"] .board-title-wrap h2 { font-size: 24px; line-height: 1.2; letter-spacing: -.02em; margin-top: 2px; }
    body[data-active-page="task"] .board-title-wrap .panel-eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .15em; margin-bottom: 0; }
    body[data-active-page="task"] .board-title-wrap .board-sub { font-size: 12px; margin-top: 2px; }
    body[data-active-page="task"] .count-badge { font-size: 12px; font-weight: 500; color: var(--gold-hover); padding: 4px 10px; }
    body[data-active-page="task"] .btn-add { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 6px; font-weight: 600; }
    body[data-active-page="task"] .btn-add svg { width: 14px; height: 14px; }
    @media (min-width: 521px) { body[data-active-page="task"] .board-header { align-items: flex-end; } }

    /* Filter bar: search on top, chips below */
    body[data-active-page="task"] .filter-bar { flex-direction: column; align-items: stretch; gap: 12px; margin-bottom: 20px; }
    body[data-active-page="task"] .search-wrap { flex: none; width: 100%; }
    body[data-active-page="task"] .search-wrap svg { left: 12px; width: 16px; height: 16px; }
    body[data-active-page="task"] #searchInput { background: #fff; border-radius: 8px; padding: 9px 34px 9px 36px; font-family: 'Inter', sans-serif; font-size: 13px; }
    body[data-active-page="task"] .search-clear { right: 10px; }
    body[data-active-page="task"] .chips { flex: none; flex-wrap: nowrap; gap: 6px; overflow-x: auto; scrollbar-width: none; }
    body[data-active-page="task"] .chips::-webkit-scrollbar { display: none; }
    body[data-active-page="task"] .chip { font-size: 11px; font-weight: 600; padding: 5px 12px; flex-shrink: 0; white-space: nowrap; }
    body[data-active-page="task"] .chip:hover { border-color: var(--gold-border); color: var(--gold); }
    body[data-active-page="task"] .chip.active { background: var(--gold); border-color: var(--gold); color: #fff; }

    /* Board: status columns */
    .tk-board { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
    .tk-board.is-single { grid-template-columns: minmax(0, 1fr); }
    .tk-board .state-box { grid-column: 1 / -1; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
    @media (max-width: 1024px) { .tk-board, .tk-board.is-single { grid-template-columns: minmax(0, 1fr); } }

    .tk-col { min-width: 0; background: #f7f6f4; border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .tk-col-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 6px; }
    .tk-col-title { display: flex; align-items: center; gap: 7px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
    .tk-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .tk-dot-amber { background: var(--tk-amber); } .tk-dot-blue { background: var(--tk-blue); } .tk-dot-green { background: var(--tk-green); }
    .tk-col-count { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: var(--muted); background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; }
    .tk-col-cards { display: flex; flex-direction: column; gap: 10px; }
    .tk-col-empty { padding: 20px 12px; text-align: center; border: 1px dashed var(--line-2); border-radius: 10px; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

    /* Task card */
    .tk-card { position: relative; overflow: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.02); cursor: pointer; outline: none; transition: box-shadow .15s, border-color .15s; }
    .tk-card:hover { border-color: var(--line-2); box-shadow: 0 4px 12px rgba(0,0,0,.05); }
    .tk-card:focus-visible { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-dim); }
    .tk-accent { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
    .tk-accent-amber { background: var(--tk-amber); } .tk-accent-blue { background: var(--tk-blue); } .tk-accent-green { background: var(--tk-green); }
    .tk-card-inner { padding: 12px 14px 12px 17px; display: flex; flex-direction: column; gap: 8px; }
    .tk-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .tk-card-title { min-width: 0; font-size: 13.5px; font-weight: 600; color: var(--ink); line-height: 1.35; word-break: break-word; }
    .tk-card.is-done .tk-card-title { color: var(--muted); text-decoration: line-through; }

    .tk-pills { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .tk-pill { display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0; white-space: nowrap; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; }
    .tk-pill svg { width: 12px; height: 12px; }
    .tk-pill-date { background: var(--info-bg); color: var(--muted); border: 1px solid var(--line); }
    .tk-pill-done { background: #dcfce7; color: #166534; border: 1px solid rgba(22,101,52,.25); }
    .tk-pill-urgent { background: var(--urgent-bg); color: var(--urgent); border: 1px solid rgba(185,28,28,.25); }
    .tk-pill-medium { background: var(--warn-bg); color: var(--warn); border: 1px solid rgba(180,83,9,.25); }
    .tk-pill-low { background: var(--ok-bg); color: var(--ok); border: 1px solid rgba(21,128,61,.25); }

    .tk-note { display: flex; align-items: flex-start; gap: 6px; background: #fafaf8; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font-size: 12px; font-style: italic; line-height: 1.4; color: var(--ink-2); word-break: break-word; }
    .tk-note svg { width: 14px; height: 14px; flex-shrink: 0; margin-top: 1px; color: var(--gold); }
    .tk-note.is-done svg { color: var(--ok); }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
</head>

<body data-active-page="task" data-require-role="admin" data-header-title="Marketing Desk">
  <div id="header-container"></div>
  <script src="header-loader.js?v=20260728-1"></script>

  <div id="sidebar-container"></div>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <main class="body-wrap single-page">
    <section class="right-panel">
      <div class="board-header page-header">
        <div class="board-title-wrap">
          <div class="panel-eyebrow">Task List</div>
          <h2>Tasks</h2>
          <div class="board-sub" id="boardSubTitle">Track work by status.</div>
        </div>
        <div class="header-actions">
          <span class="count-badge" id="countLabel">loading...</span>
          <button type="button" class="btn-add" id="addNewBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4.5v15m7.5-7.5h-15"/></svg>
            Add New
          </button>
        </div>
      </div>

      <div class="filter-bar">
        <div class="search-wrap" id="searchWrapBox">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input id="searchInput" type="text" placeholder="Search tasks, descriptions, or notes...">
          <button type="button" class="search-clear" id="searchClear" aria-label="Clear search">&times;</button>
        </div>
        <div class="chips" id="chipBar">
          <button type="button" class="chip active" data-filter="All">All</button>
          <button type="button" class="chip" data-filter="Not started">Not Started</button>
          <button type="button" class="chip" data-filter="In progress">In Progress</button>
          <button type="button" class="chip" data-filter="Done">Done</button>
        </div>
      </div>

      <div class="board-list-wrap">
        <div id="list" class="tk-board">
          <div class="state-box">
            <div class="state-spinner"></div>
            <div class="state-label">Loading tasks...</div>
          </div>
        </div>
      </div>

      <div class="help-note">Click a task to edit.</div>
    </section>
  </main>

  <div id="toastOk" class="toast toast-ok"><span class="toast-icon">✓</span><span id="toastOkMsg">Saved</span></div>
  <div id="toastErr" class="toast toast-err"><span class="toast-icon">✕</span><span id="toastErrMsg">Something went wrong</span></div>

  <div id="taskOverlay" class="overlay">
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="modalTitle">Add Task</h3>
        <button type="button" class="close-btn" id="modalClose">&times;</button>
      </div>
      <form id="taskForm">
        <input type="hidden" id="taskId">
        <div class="modal-top-actions hidden" id="taskTopActions">
          <button type="button" class="btn-inline-danger" id="deleteTaskBtn">Delete</button>
          <button type="button" class="btn-inline-ok" id="markDoneBtn">Mark as Done</button>
        </div>
        <div class="field">
          <label for="taskName">Task Name</label>
          <input id="taskName" type="text" placeholder="Follow up client" autocomplete="off">
        </div>
        <div class="field">
          <label for="deadline">Deadline <span class="opt-tag">optional</span></label>
          <input id="deadline" type="date">
        </div>
        <div class="field-row">
          <div class="field">
            <label for="status">Status</label>
            <select id="status">
              <option value="Not started">Not started</option>
              <option value="In progress">In progress</option>
              <option value="Done" id="statusDoneOption">Done</option>
            </select>
          </div>
          <div class="field">
            <label for="priority">Priority</label>
            <select id="priority">
              <option value="Low">Low</option>
              <option value="Medium">Medium</option>
              <option value="Urgent">Urgent</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="note">Note <span class="opt-tag">optional</span></label>
          <textarea id="note" placeholder="Add details if needed..."></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="modalCancel">Cancel</button>
          <button type="submit" class="btn-primary" id="saveBtn"><span id="saveLabel">Save Task</span></button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const SCRIPT_URL = SUPABASE_CONFIG.TASKS_API_URL;
    let allItems = [];
    let activeFilter = 'All';
    let editingId = '';

    const listEl = document.getElementById('list');
    const countLabel = document.getElementById('countLabel');
    const overlay = document.getElementById('taskOverlay');
    const form = document.getElementById('taskForm');
    const saveBtn = document.getElementById('saveBtn');
    const saveLabel = document.getElementById('saveLabel');
    const taskTopActions = document.getElementById('taskTopActions');
    const deleteTaskBtn = document.getElementById('deleteTaskBtn');
    const markDoneBtn = document.getElementById('markDoneBtn');

    function showToast(id, msgId, msg, dur) {
      const el = document.getElementById(id);
      document.getElementById(msgId).textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), dur || 3000);
    }
    function showOk(msg) { showToast('toastOk', 'toastOkMsg', msg, 2600); }
    function showErr(msg) { showToast('toastErr', 'toastErrMsg', msg, 3500); }
    function esc(s) { return !s ? '' : String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function fmtDate(iso) {
      if (!iso) return '-';
      const d = new Date(iso + 'T00:00:00');
      if (isNaN(d)) return iso;
      return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
    }
    function priorityClass(p) { return {'Low':'pill-low','Medium':'pill-medium','Urgent':'pill-urgent'}[p] || ''; }
    function statusClass(s) {
      return s === 'Not started' ? 'pill-not-started' : s === 'In progress' ? 'pill-in-progress' : s === 'Done' ? 'pill-done' : '';
    }

    function openModal(item) {
      editingId = item ? String(item.id) : '';
      document.getElementById('modalTitle').textContent = item ? 'Edit Task' : 'Add Task';
      document.getElementById('taskId').value = editingId;
      document.getElementById('taskName').value = item ? (item.taskName || '') : '';
      document.getElementById('deadline').value = item ? (item.deadline || '') : '';
      document.getElementById('status').value = item ? (item.status || 'Not started') : 'Not started';
      document.getElementById('priority').value = item ? (item.priority || 'Low') : 'Low';
      document.getElementById('note').value = item ? (item.note || '') : '';
      document.getElementById('statusDoneOption').disabled = !item;
      document.getElementById('statusDoneOption').hidden = !item;
      taskTopActions.classList.toggle('hidden', !item);
      markDoneBtn.disabled = item && item.status === 'Done';
      markDoneBtn.textContent = item && item.status === 'Done' ? 'Done' : 'Mark as Done';
      saveLabel.textContent = item ? 'Save Changes' : 'Save Task';
      overlay.classList.add('show');
      setTimeout(() => document.getElementById('taskName').focus(), 50);
    }

    function closeModal() {
      overlay.classList.remove('show');
      form.reset();
      editingId = '';
    }

    document.getElementById('addNewBtn').addEventListener('click', () => openModal(null));
    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('modalCancel').addEventListener('click', closeModal);
    overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });

    document.getElementById('chipBar').addEventListener('click', function(e) {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      activeFilter = chip.dataset.filter;
      renderList();
    });

    document.getElementById('searchInput').addEventListener('input', function() {
      document.getElementById('searchClear').classList.toggle('visible', this.value.length > 0);
      renderList();
    });
    document.getElementById('searchClear').addEventListener('click', function() {
      document.getElementById('searchInput').value = '';
      this.classList.remove('visible');
      renderList();
    });

    const ICON_CAL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 9v7.5"/></svg>';
    const ICON_NOTE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.5 8.25h9m-9 3H12m-9.75 1.51c0 1.6 1.123 2.994 2.707 3.227 1.129.166 2.27.293 3.423.379.35.026.67.21.865.501L12 21l2.755-4.133a1.14 1.14 0 01.865-.501 48.172 48.172 0 003.423-.379c1.584-.233 2.707-1.626 2.707-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 48.394 0 0012 3c-2.392 0-4.744.175-7.043.513C3.373 3.746 2.25 5.14 2.25 6.741v6.018z"/></svg>';
    const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12.75l6 6 9-13.5"/></svg>';

    const COLUMN_META = {
      'Not started': { label: 'Not Started', tone: 'amber' },
      'In progress': { label: 'In Progress', tone: 'blue' },
      'Done':        { label: 'Done',        tone: 'green' }
    };

    function columnKey(item) {
      const s = item.status || 'Not started';
      return s === 'In progress' ? 'In progress' : s === 'Done' ? 'Done' : 'Not started';
    }

    function renderRow(item) {
      const isDone = item.status === 'Done';
      const tone = COLUMN_META[columnKey(item)].tone;

      let meta = '';
      if (item.deadline) meta += '<span class="tk-pill tk-pill-date">' + ICON_CAL + esc(fmtDate(item.deadline)) + '</span>';
      if (isDone) meta += '<span class="tk-pill tk-pill-done">Done</span>';

      const priority = item.priority
        ? '<span class="tk-pill ' + ({'Low':'tk-pill-low','Medium':'tk-pill-medium','Urgent':'tk-pill-urgent'}[item.priority] || '') + '">' + esc(item.priority) + '</span>'
        : '';

      return `<article class="tk-card ${isDone ? 'is-done' : ''}" id="row-${item.id}" data-row-id="${item.id}" tabindex="0" role="button">
        <div class="tk-accent tk-accent-${tone}"></div>
        <div class="tk-card-inner">
          <div class="tk-card-top">
            <h3 class="tk-card-title">${esc(item.taskName || '(untitled task)')}</h3>
            ${priority}
          </div>
          ${meta ? `<div class="tk-pills">${meta}</div>` : ''}
          ${item.note ? `<div class="tk-note ${isDone ? 'is-done' : ''}">${isDone ? ICON_CHECK : ICON_NOTE}<span>${esc(item.note)}</span></div>` : ''}
        </div>
      </article>`;
    }

    function renderColumn(key, items) {
      const meta = COLUMN_META[key];
      return `<section class="tk-col" data-column="${key}">
        <div class="tk-col-head">
          <div class="tk-col-title"><span class="tk-dot tk-dot-${meta.tone}"></span><span>${meta.label}</span></div>
          <span class="tk-col-count">${items.length}</span>
        </div>
        <div class="tk-col-cards">
          ${items.length ? items.map(renderRow).join('') : '<div class="tk-col-empty">No tasks</div>'}
        </div>
      </section>`;
    }

    function renderList() {
      const q = (document.getElementById('searchInput').value || '').toLowerCase().trim();
      let filtered = allItems.filter(i => i.type === 'Task List');
      if (activeFilter === 'All') {
        filtered = filtered.filter(i => (i.status || 'Not started') !== 'Done');
      } else {
        filtered = filtered.filter(i => (i.status || 'Not started') === activeFilter);
      }
      if (q) {
        filtered = filtered.filter(i =>
          (i.taskName || '').toLowerCase().includes(q) ||
          (i.note || '').toLowerCase().includes(q) ||
          (i.status || '').toLowerCase().includes(q) ||
          (i.priority || '').toLowerCase().includes(q)
        );
      }
      filtered.sort((a, b) => {
        const doneA = a.status === 'Done' ? 1 : 0;
        const doneB = b.status === 'Done' ? 1 : 0;
        if (doneA !== doneB) return doneA - doneB;
        const priorityRank = {Urgent: 0, Medium: 1, Low: 2};
        return (priorityRank[a.priority] ?? 3) - (priorityRank[b.priority] ?? 3);
      });

      countLabel.textContent = filtered.length + ' item' + (filtered.length === 1 ? '' : 's');
      listEl.classList.toggle('is-single', activeFilter !== 'All');

      if (!filtered.length) {
        listEl.innerHTML = `<div class="state-box"><div class="state-icon">○</div><div class="state-label">${q ? 'No results' : 'No tasks yet'}</div></div>`;
        return;
      }

      // "All" = open work (Not started + In progress); a specific chip shows just that column
      const columns = activeFilter === 'All' ? ['Not started', 'In progress'] : [activeFilter];
      listEl.innerHTML = columns
        .map(key => renderColumn(key, filtered.filter(i => columnKey(i) === key)))
        .join('');
    }

    function openFromCard(card) {
      const item = allItems.find(i => String(i.id) === String(card.dataset.rowId));
      if (item) openModal(item);
    }
    listEl.addEventListener('click', function(e) {
      const card = e.target.closest('.tk-card');
      if (card) openFromCard(card);
    });
    listEl.addEventListener('keydown', function(e) {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      const card = e.target.closest('.tk-card');
      if (!card) return;
      e.preventDefault();
      openFromCard(card);
    });

    function setSaveLoading(on) {
      saveBtn.disabled = on;
      saveLabel.innerHTML = on ? '<span class="spinner-sm"></span> Saving...' : (editingId ? 'Save Changes' : 'Save Task');
    }

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const payload = editingId
        ? { action: 'updateItem', id: editingId, type: 'Task List' }
        : { type: 'Task List' };

      payload.taskName = document.getElementById('taskName').value.trim();
      payload.deadline = document.getElementById('deadline').value;
      payload.status = document.getElementById('status').value;
      payload.priority = document.getElementById('priority').value;
      payload.note = document.getElementById('note').value.trim();

      if (!payload.taskName) {
        showErr('Task name is required');
        return;
      }

      const wasEditing = Boolean(editingId);
      setSaveLoading(true);
      SeminyakAuth.authFetch(SCRIPT_URL, {
        method: 'POST',
        headers: {'Content-Type': 'text/plain;charset=utf-8'},
        body: JSON.stringify(payload)
      })
        .then(res => {
          if (res.success) {
            closeModal();
            showOk(wasEditing ? 'Task updated' : 'Task added');
            loadItems();
          } else {
            showErr(res.message || 'Failed to save task');
          }
        })
        .catch(err => showErr(err.message || String(err)))
        .finally(() => setSaveLoading(false));
    });

    markDoneBtn.addEventListener('click', function() {
      if (!editingId) return;
      markDone(editingId, true);
    });

    deleteTaskBtn.addEventListener('click', function() {
      if (!editingId) return;
      if (!confirm('Delete this task?')) return;
      deleteTask(editingId);
    });

    function markDone(id, closeAfter) {
      const item = allItems.find(i => String(i.id) === String(id));
      if (!item || item.status === 'Done') return;
      const row = document.getElementById('row-' + id);
      if (row) row.style.opacity = '.45';
      markDoneBtn.disabled = true;
      markDoneBtn.textContent = 'Updating...';
      SeminyakAuth.authFetch(SCRIPT_URL, {
        method: 'POST',
        headers: {'Content-Type': 'text/plain;charset=utf-8'},
        body: JSON.stringify({ action: 'updateStatus', id, status: 'Done' })
      })
        .then(res => {
          if (res.success) {
            showOk('Task marked done');
            if (closeAfter) closeModal();
            loadItems();
          } else {
            showErr(res.message || 'Failed to update task');
            if (row) row.style.opacity = '1';
          }
        })
        .catch(err => {
          showErr(err.message || String(err));
          if (row) row.style.opacity = '1';
        })
        .finally(() => {
          markDoneBtn.disabled = false;
          markDoneBtn.textContent = 'Mark as Done';
        });
    }

    function deleteTask(id) {
      deleteTaskBtn.disabled = true;
      deleteTaskBtn.textContent = 'Deleting...';
      SeminyakAuth.authFetch(SCRIPT_URL, {
        method: 'POST',
        headers: {'Content-Type': 'text/plain;charset=utf-8'},
        body: JSON.stringify({ action: 'deleteItem', id, type: 'Task List' })
      })
        .then(res => {
          if (res.success) {
            closeModal();
            showOk('Task deleted');
            loadItems();
          } else {
            showErr(res.message || 'Failed to delete task');
          }
        })
        .catch(err => showErr(err.message || String(err)))
        .finally(() => {
          deleteTaskBtn.disabled = false;
          deleteTaskBtn.textContent = 'Delete';
        });
    }

    function loadItems() {
      fetch(SCRIPT_URL + '?action=getReminders')
        .then(r => r.json())
        .then(res => {
          if (!res.success) throw new Error(res.message || 'Failed to load tasks');
          allItems = res.data || [];
          renderList();
        })
        .catch(() => {
          listEl.innerHTML = '<div class="state-box state-error"><div class="state-icon">!</div><div class="state-label">Failed to load tasks</div></div>';
        });
    }

    loadItems();
  </script>

  <script src="sidebar-loader.js?v=20260712-1"></script>
</body>
